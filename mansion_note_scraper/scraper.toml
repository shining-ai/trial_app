# マンションノート スクレイパー 設定ファイル
# 使い方: docker compose run --rm scraper
#         （/app/scraper.toml が存在すれば自動ロード）
#
# CLI 引数は常にこのファイルの設定より優先されます。
# 例: docker compose run --rm scraper --max-pages 1   ← max_pages を上書き

# ----------------------------------------------------------------
# 検索種別・エリア
# ----------------------------------------------------------------

type      = "chintai"       # "mansion"（分譲）or "chintai"（賃貸）
area_code = "ct1000525"     # 武蔵野市のエリアコード
                            # サイトの検索URL の area=ctXXXXXX から確認できます
# area    = "武蔵野市"      # area_code の代わりにエリア名でも可

# ----------------------------------------------------------------
# 実行設定
# ----------------------------------------------------------------

debug       = false    # true にすると各ステップでスクリーンショットを output/ に保存

max_pages   = 10      # 取得する最大ページ数
page_delay  = 5.0     # 検索結果ページ取得後の待機時間（秒）
unit_delay  = 3.0     # 部屋ページ取得後の待機時間（秒）
photo_delay = 1.5     # 写真 1 枚ごとのダウンロード間隔（秒）
no_photos   = false   # true にすると写真ダウンロードをスキップ

# ----------------------------------------------------------------
# 賃貸フィルタ（type = "chintai" のとき有効）
# ----------------------------------------------------------------

layout    = ["2ldk", "3ldk", "4ldk"]          # 間取り（複数可）
rent_max  = 26                                  # 賃料上限（万円）
kanrihi   = true                               # true = 管理費込みで上限適用
area_min  = 55                                  # 専有面積下限（㎡）
walk_max  = 7                                   # 最寄り駅からの徒歩上限（分）
structure = ["rebar", "steel", "others"]       # 建物構造
           # rebar  = 鉄筋系（RC・SRC）
           # steel  = 鉄骨系
           # others = ブロック・その他

# ----------------------------------------------------------------
# 分譲マンションフィルタ（type = "mansion" のとき有効）
# ----------------------------------------------------------------

# price_min = 3000   # 価格下限（万円）
# price_max = 8000   # 価格上限（万円）
# age_max   = 20     # 築年数上限（年）
# layout    = ["2ldk", "3ldk"]
